name: Termscape

options:
  bundleIdPrefix: ee.vene
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NodetermKit:
    path: .
  SwiftTerm:
    # Supply-chain decision: pinned to an EXACT version (SPEC / house rules). Do not widen.
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.15.0

targets:
  Termscape:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    dependencies:
      - package: NodetermKit
        product: NodetermKit
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.vene.termscape
        INFOPLIST_KEY_CFBundleDisplayName: "Termscape"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Device signing: automatic, Siim's team (Apple Development cert in login keychain).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D7HDY2ST3C
        # Compile the REAL NodetermKit wiring in Factory.swift (stubs without it).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NODETERM_KIT_IMPL_READY"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        # App Store export compliance: the app uses only standard SSH/TLS encryption, which is
        # exempt. Declaring this here skips the per-build Compliance question in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # SPEC §9.5 / §10: dictation needs mic + speech permission usage strings.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Termscape uses the microphone for voice-to-text dictation into your terminal sessions."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Termscape uses on-device speech recognition to turn your voice into terminal input."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone-only (device family 1): portrait + both landscapes, no upside-down.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  TermscapeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: Termscape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.vene.termscape.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Termscape

schemes:
  Termscape:
    build:
      targets:
        Termscape: all
        TermscapeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TermscapeUITests
